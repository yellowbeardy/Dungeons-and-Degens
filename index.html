<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111426"><title>Dungeons & Degens</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f3edf9;background:#0b0d19}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -20%,#3b2459 0,transparent 40%),#0b0d19;min-height:100vh}button{font:inherit;cursor:pointer;border:1px solid #676083;border-radius:12px;color:white;background:#30294c;padding:12px 14px;touch-action:manipulation}button:hover{background:#4a376f}button:disabled{opacity:.35;cursor:not-allowed}button.primary{background:linear-gradient(110deg,#6b3bbc,#216e80);border-color:#b589ff}button.danger{background:#663345}.wrap{max-width:880px;margin:auto;padding:14px 14px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:16px}h1{font-size:clamp(24px,5vw,36px);margin:3px 0}h2{margin:0 0 10px;font-size:22px}h3{margin:0 0 8px}small,.muted{color:#c2b5d4}p{line-height:1.55}.logo{font-size:24px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#d68bff,#68e6d9);color:transparent;background-clip:text}.panel{border:1px solid #3f3a59;background:#191c30ed;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 6px 24px #0004}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border:1px solid #393b53;border-radius:10px;padding:9px;background:#101323}.stat strong{display:block;font-size:20px;color:#8defdf}.stat small{font-size:11px}.classes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{display:block;text-align:left;min-height:116px}.choice.selected{outline:2px solid #8de2dc;background:#344161}.choice strong{display:block;font-size:17px;margin-bottom:6px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.actions button{text-align:left}.meter{height:12px;background:#3a3047;border-radius:20px;overflow:hidden;margin:7px 0}.meter div{height:100%;background:linear-gradient(90deg,#dc637e,#efbc7f)}.xp div{background:linear-gradient(90deg,#6b6ff3,#70e3c5)}.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:12px}.tile{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(19px,5vw,32px);border-radius:9px;background:#29233b;border:1px solid #4d4561}.tile.done{background:#1a453d}.tile.current{outline:2px solid #efd27b;background:#594069}.tile.future{filter:brightness(.35)}.log{max-height:250px;overflow:auto;padding:10px;background:#0e1222;border-radius:10px;font-size:13px;line-height:1.5}.log div{border-bottom:1px solid #272c42;padding:5px 0}.enemyArt{text-align:center;font-size:74px;text-shadow:0 0 45px #9c59d3;margin:12px}.banner{padding:10px 12px;background:#284941;border-radius:10px;border:1px solid #46998f}.gold{color:#ffd278}.hidden{display:none!important}.tag{padding:5px 9px;border-radius:30px;background:#3b3155;font-size:12px}.inventory{display:flex;gap:6px;flex-wrap:wrap}.inventory span{background:#32344b;border-radius:7px;padding:6px 9px;font-size:12px}footer{text-align:center;color:#9789ae;font-size:12px;padding-top:18px}@media(max-width:650px){.split{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:14px}.classes{grid-template-columns:1fr 1fr}.choice{min-height:145px;font-size:13px;padding:9px}.choice strong{font-size:15px}}
</style></head><body><div class="wrap"><header><div><div class="logo">🎲 DUNGEONS & DEGENS</div><small>Roll for initiative. Pray for liquidity.</small></div><div class="flex"><button id="soundBtn">🔊 Sound on</button><button id="restartBtn" class="danger">New run</button></div></header><main id="app"></main><footer>Original parody RPG · No wallet connection · No real money · Saved on this device</footer></div><script>
'use strict';
const $=id=>document.getElementById(id),KEY='dungeons-degens-save-v1';
const CLASSES={paladin:{name:'Bitcoin Paladin',emoji:'🛡️',hp:42,attack:7,def:3,energy:3,skill:'Proof of Work',desc:'Sturdy hodler. Block incoming damage, then strike back.'},rogue:{name:'Solana Rogue',emoji:'🗡️',hp:31,attack:9,def:1,energy:4,skill:'Atomic Swap',desc:'Fast and deadly. Strike twice with volatile damage.'},mage:{name:'Gas Necromancer',emoji:'🔮',hp:29,attack:8,def:1,energy:5,skill:'Gas Storm',desc:'Burn enemies with arcane fees and bypass armor.'},goblin:{name:'Memecoin Alchemist',emoji:'🧪',hp:34,attack:7,def:2,energy:4,skill:'Pump & Dump',desc:'Wild damage that can backfire spectacularly.'}};
const FOES=[{name:'Rug-Pull Imp',emoji:'👺',hp:17,atk:5,def:0,coin:12,xp:11},{name:'Slippage Slime',emoji:'🦠',hp:23,atk:6,def:1,coin:15,xp:13},{name:'Gas Golem',emoji:'🗿',hp:28,atk:7,def:2,coin:19,xp:16},{name:'Yield Vampire',emoji:'🦇',hp:25,atk:8,def:1,coin:21,xp:18},{name:'Liquidity Lich',emoji:'💀',hp:34,atk:9,def:2,coin:28,xp:22}];
const BOSS={name:'Bitcoin Dragon of Mount Gox',emoji:'🐉',hp:92,atk:12,def:3,coin:250,xp:90};
const NODES=['⚔️','🎁','⚔️','⛺','⚔️','🎲','⚔️','🎁','⚔️','⛺','⚔️','🎲','⚔️','🎁','⚔️','⛺','⚔️','🎁','⚔️','🐉'];
let state=null,selected='rogue',sound=true,clickLock=false;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const roll=(n=20)=>rand(1,n);
function clean(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function baseState(cls){let c=CLASSES[cls];return {cls,name:c.name,level:1,xp:0,hp:c.hp,maxHp:c.hp,atk:c.attack,def:c.def,maxEnergy:c.energy,energy:c.energy,potions:2,gold:0,position:0,stage:'explore',enemy:null,guard:0,bleed:0,turn:0,shield:0,log:['A suspicious owl hoots. The Dungeon Master grins.'],loot:[],victory:false,deaths:0,score:0};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&CLASSES[o.cls]&&Number.isInteger(o.position)&&o.position>=0&&o.position<=NODES.length&&['explore','combat','choice','dead','won'].includes(o.stage))return o;}catch(e){}return null;}
function note(t){state.log.unshift(t);state.log=state.log.slice(0,36);}
function beep(freq=470){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.035;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.09);o.onended=()=>ctx.close();}catch(e){}}
function choiceUI(){return `<section class="panel"><h2>Choose your degen</h2><p class="muted">A one-player, twenty-room dungeon with a real ending. Every run shuffles encounters and loot.</p><div class="classes">${Object.entries(CLASSES).map(([id,c])=>`<button class="choice ${id===selected?'selected':''}" data-class="${id}"><strong>${c.emoji} ${c.name}</strong>${c.desc}</button>`).join('')}</div><p>🎲 Roll a D20. Fight monsters. Collect loot. Defeat the Bitcoin Dragon. Your progress saves automatically.</p><button class="primary" id="start">Enter the Dungeon →</button></section>`;}
function topbar(){return `<section class="panel"><div class="flex" style="justify-content:space-between"><strong>${CLASSES[state.cls].emoji} ${state.name}</strong><span class="tag">Level ${state.level} · Room ${Math.min(20,state.position+1)}/20</span></div><div class="stats"><div class="stat"><small>❤️ HP</small><strong>${state.hp}/${state.maxHp}</strong></div><div class="stat"><small>✨ Mana</small><strong>${state.energy}/${state.maxEnergy}</strong></div><div class="stat"><small>⚔️ Attack</small><strong>${state.atk}</strong></div><div class="stat"><small>🪙 Loot</small><strong>${state.gold}</strong></div></div><div class="meter"><div style="width:${Math.max(0,100*state.hp/state.maxHp)}%"></div></div><div class="meter xp"><div style="width:${100*state.xp/(state.level*30)}%"></div></div><small>XP ${state.xp}/${state.level*30} · Armor ${state.def} · Potions ${state.potions}</small></section>`;}
function map(){return `<section class="panel"><h3>🗺️ The Slippage Catacombs</h3><div class="map">${NODES.map((n,i)=>`<div class="tile ${i<state.position?'done':i===state.position?'current':'future'}" title="Room ${i+1}">${i<state.position?'✓':n}</div>`).join('')}</div></section>`;}
function inventory(){return `<section class="panel"><h3>🎒 Inventory & journal</h3><div class="inventory">${state.loot.length?state.loot.map(x=>`<span>${clean(x)}</span>`).join(''):'<span>Empty pockets. Maximum optimism.</span>'}</div><h3 style="margin-top:16px">📜 Adventure log</h3><div class="log" aria-live="polite">${state.log.map(x=>`<div>${clean(x)}</div>`).join('')}</div></section>`;}
function eventText(){const i=state.position;return i===19?'A mountain of discarded hardware wallets shakes. The Bitcoin Dragon awakens.':'The corridor smells of brimstone, leverage, and questionable tokenomics.';}
function play(){if(!state)return;let s=state;if(s.stage==='explore')return `<section class="panel"><h2>Door ${s.position+1}: ${NODES[s.position]} ${s.position===19?'The Final Block':'The Next Block'}</h2><p>${eventText()}</p><button class="primary" id="advance">Open the door 🎲</button></section>`;
if(s.stage==='combat'){let e=s.enemy;return `<section class="panel"><h2>⚔️ Encounter: ${clean(e.name)}</h2><div class="enemyArt">${e.emoji}</div><strong>${clean(e.name)} · ❤️ ${e.hp}/${e.maxHp}</strong><div class="meter"><div style="width:${Math.max(0,e.hp/e.maxHp*100)}%"></div></div><p class="muted">Turn ${s.turn+1}. D20 accuracy and critical hits apply. Your action triggers the enemy's response if it survives.</p><div class="actions"><button data-act="attack">⚔️ Strike <small>(free)</small></button><button data-act="skill" ${s.energy<1?'disabled':''}>✨ ${CLASSES[s.cls].skill} <small>(1 mana)</small></button><button data-act="guard">🛡️ Defend <small>(restore 1 mana)</small></button><button data-act="potion" ${s.potions<1?'disabled':''}>🧪 Potion (${s.potions}) <small>(heal 18)</small></button></div></section>`;}
if(s.stage==='choice')return `<section class="panel"><h2>${s.event.title}</h2><p>${s.event.desc}</p><div class="actions">${s.event.opts.map((o,i)=>`<button data-choice="${i}">${o}</button>`).join('')}</div></section>`;
if(s.stage==='dead')return `<section class="panel"><h2>💀 Liquidated!</h2><p>Your holdings have been transferred to the Great Rug in the Sky.</p><p>Cleared ${s.position} rooms · ${s.gold} gold · Level ${s.level}</p><button class="primary" id="again">Try another run</button></section>`;
return `<section class="panel"><h2>🏆 THE GENESIS BLOCK IS YOURS!</h2><div class="enemyArt">🏆</div><p>With a final critical hit, the Bitcoin Dragon collapses into a pile of ancient mining rigs. The barred owls chant your wallet address. You have escaped the Slippage Catacombs.</p><h3 class="gold">Final score: ${s.score+s.gold+s.level*50}</h3><p>Rooms cleared: 20 · Gold: ${s.gold} · Level: ${s.level}</p><button class="primary" id="again">New Game +</button></section>`;}
function render(){let a=$('app');a.innerHTML=state?`${topbar()}${play()}${map()}${inventory()}`:choiceUI();a.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{selected=b.dataset.class;render()});if($('start'))$('start').onclick=()=>{state=baseState(selected);save();render()};if($('again'))$('again').onclick=()=>{state=baseState(state.cls);save();render()};if($('advance'))$('advance').onclick=advance;a.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>combatAction(b.dataset.act));a.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>resolveChoice(Number(b.dataset.choice)));}
function advance(){if(state.stage!=='explore')return;const i=state.position;beep(510);if(i===19||NODES[i]==='⚔️'){let template=i===19?BOSS:FOES[(i+rand(0,4))%FOES.length];const scale=Math.floor(i/5);let e={...template,hp:template.hp+scale*5,atk:template.atk+scale,def:template.def+Math.floor(scale/2)};e.maxHp=e.hp;state.enemy=e;state.stage='combat';state.turn=0;note('⚔️ '+e.name+' emerges from the blockchain fog.');}else if(NODES[i]==='⛺'){state.event={type:'camp',title:'⛺ Validator Camp',desc:'A suspiciously helpful validator offers rest or training. No staking lockup required.',opts:['Rest: heal 22 HP + mana','Train: gain 18 XP']};state.stage='choice';}else if(NODES[i]==='🎁'){state.event={type:'treasure',title:'🎁 The Unrugged Chest',desc:'A locked chest hums with ancient liquidity. Do you take the stable route or embrace volatility?',opts:['Safe loot: 25 gold','Wild loot: risk a D20']};state.stage='choice';}else{state.event={type:'fate',title:'🎲 The Oracle of Bad Trades',desc:'An ancient oracle offers questionable financial advice. A die rattles inside its skull.',opts:['Risk the prophecy','Decline and gain 1 potion']};state.stage='choice';}save();render();}
function finishRoom(){state.position++;state.stage=state.position>=NODES.length?'won':'explore';if(state.stage==='won')note('🏆 You conquered the Slippage Catacombs!');save();render();}
function xpGain(n){state.xp+=n;while(state.xp>=state.level*30){state.xp-=state.level*30;state.level++;state.maxHp+=7;state.hp=Math.min(state.maxHp,state.hp+14);state.atk+=2;if(state.level%2===0)state.def++;state.maxEnergy++;state.energy=state.maxEnergy;note(`⬆️ Level ${state.level}! Attack, health, and mana increased.`);}}
function resolveChoice(idx){let s=state;if(s.stage!=='choice')return;let t=s.event.type,r=roll();if(t==='camp'){if(idx===0){s.hp=Math.min(s.maxHp,s.hp+22);s.energy=s.maxEnergy;note('⛺ Fully refueled with validator-approved soup.');}else{xpGain(18);note('📚 You studied tokenomics without falling asleep.');}}else if(t==='treasure'){if(idx===0){s.gold+=25;note('🪙 Claimed 25 gold. Stability is surprisingly sexy.');}else if(r>=11){s.gold+=65;s.potions++;note(`🎲 Rolled ${r}: jackpot! 65 gold and a potion.`);}else{s.hp=Math.max(1,s.hp-10);note(`🎲 Rolled ${r}: the chest was leveraged. Lost 10 HP.`);}}else{if(idx===1){s.potions++;note('🧪 Politely declined the Oracle and got a potion.');}else if(r>=12){s.atk++;note(`🎲 Rolled ${r}: bullish omen, +1 attack.`);}else{s.hp=Math.max(1,s.hp-7);s.gold+=10;note(`🎲 Rolled ${r}: cursed prophecy, -7 HP but +10 gold.`);}}s.event=null;finishRoom();}
function hitChance(attackRoll){return attackRoll>=5;}
function enemyTurn(){let s=state,e=s.enemy;if(!e||e.hp<=0)return;const r=roll();if(r<=3){note(`💨 ${e.name} misses (D20=${r}).`);return;}let raw=e.atk+rand(0,5)+(r===20?6:0);let dmg=Math.max(1,raw-s.def-(s.guard?8:0));s.hp=Math.max(0,s.hp-dmg);note(`💥 ${e.name} rolls ${r} and deals ${dmg} damage${s.guard?' through your guard':''}.`);s.guard=0;if(s.hp<=0){s.stage='dead';note('💀 Your portfolio has been liquidated.');}}
function combatAction(act){let s=state;if(s.stage!=='combat')return;let e=s.enemy;beep(320);if(act==='potion'){if(s.potions<1)return;s.potions--;let old=s.hp;s.hp=Math.min(s.maxHp,s.hp+18);note(`🧪 Healed ${s.hp-old} HP.`);}else if(act==='guard'){s.guard=1;s.energy=Math.min(s.maxEnergy,s.energy+1);note('🛡️ Guard up. +1 mana.');}else{if(act==='skill'&&s.energy<1)return;let r=roll();if(act==='skill')s.energy--;if(!hitChance(r)){note(`🎲 Rolled ${r}: your ${act} missed.`);}else{let crit=r===20;let raw=s.atk+rand(1,6)+(crit?9:0),dmg=0;if(act==='attack')dmg=Math.max(1,raw-e.def);else if(s.cls==='paladin'){dmg=Math.max(1,raw+3-e.def);s.guard=1;}else if(s.cls==='rogue')dmg=Math.max(1,raw-e.def)+Math.max(1,rand(3,9)-e.def);else if(s.cls==='mage')dmg=raw+5;else{let w=roll();dmg=w<=5?3:raw+(w>=16?16:5);if(w<=5){s.hp=Math.max(1,s.hp-3);note('🧪 Memecoin backfire! -3 HP.');}}e.hp=Math.max(0,e.hp-dmg);note(`🎲 D20=${r}${crit?' NATURAL 20!':''}. ${act==='skill'?CLASSES[s.cls].skill:'Strike'} dealt ${dmg} damage.`);}}
if(e.hp<=0){s.gold+=e.coin;s.score+=e.xp*3;xpGain(e.xp);note(`🏅 ${e.name} defeated. +${e.coin} gold, +${e.xp} XP.`);if(Math.random()<.37){const drops=[['Reinforced Ledger',()=>s.def++],['Sharpened Ledger',()=>s.atk++],['Health Shard',()=>{s.maxHp+=5;s.hp+=5;}],['Mana Crystal',()=>{s.maxEnergy++;s.energy++;}],['Potion of Copium',()=>s.potions++]];const [item,fn]=drops[rand(0,drops.length-1)];fn();s.loot.push(item);note(`🎁 Found ${item}!`);}if(s.position===19){s.stage='won';s.position=20;note('🏆 The Bitcoin Dragon has been slain!');}else{s.enemy=null;s.energy=Math.min(s.maxEnergy,s.energy+1);s.position++;s.stage='explore';}}else if(s.hp>0)enemyTurn();if(s.hp<=0)s.stage='dead';s.turn++;save();render();}
$('restartBtn').onclick=()=>{if(confirm('Start a fresh dungeon run? Current progress will be replaced.')){state=null;localStorage.removeItem(KEY);render();}};
$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊 Sound on':'🔇 Sound off';};
state=load();render();
</script></body></html>
